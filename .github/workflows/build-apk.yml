name: Build JARVIS APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Android SDK
    run: |
      SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
      echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      yes | "$SDKMANAGER" --licenses || true
      "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.13'

  - name: Extract project
    run: unzip -o JARVIS-Android-source.zip -d source

  - name: Build APK
    working-directory: source/JARVIS-Android
    run: gradle --no-daemon :app:assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: JARVIS-APK
      path: source/JARVIS-Android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
