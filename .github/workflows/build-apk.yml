name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: unzip -o JARVIS-Android-source.zip -d source

      - name: Build APK
        run: |
          DIR=$(dirname "$(find source -name settings.gradle* | head -n 1)")
          cd "$DIR"
          F=app/build.gradle.kts
          perl -0pi -e 's/kotlinOptions\s*\{[^}]*\}//s' "$F"
          if ! grep -q "compilerOptions" "$F"; then
            printf '\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n    }\n}\n' >> "$F"
          fi
          find . -name "*.gradle.kts" -o -name "*.toml" | xargs perl -pi -e 's/(activity[-_]?compose[^\n]*?)1\.14\.0/${1}1.10.1/i'
          gradle --no-daemon :app:assembleDebug --console=plain > build.log 2>&1 || { grep -n -B2 -A25 "What went wrong" build.log; tail -n 30 build.log; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
